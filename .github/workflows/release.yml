name: Publish Docker images
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  push_backend_to_registry:
    name: Push Swetrix API Docker image to Docker Hub
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract metadata (tags, labels) for Backend Docker
        id: meta_backend
        uses: docker/metadata-action@v6
        with:
          images: swetrix/swetrix-api
      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
      - name: Update Backend repo description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: swetrix/swetrix-api

  push_web_to_registry:
    name: Push Swetrix FE Docker image to Docker Hub
    if: startsWith(github.event.release.tag_name, 'v')
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1
    with:
      context: web
      platforms: linux/amd64,linux/arm64
      output: image
      push: true
      sign: 'false'
      meta-images: swetrix/swetrix-fe
      meta-tags: type=ref,event=tag
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ toJSON(secrets.DOCKER_USERNAME) }}
          password: ${{ toJSON(secrets.DOCKER_PASSWORD) }}

  update_web_description:
    name: Update Web repo description
    needs: push_web_to_registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Update Web repo description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: swetrix/swetrix-fe
