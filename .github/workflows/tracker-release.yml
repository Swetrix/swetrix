name: Publish package to npm
on:
  release:
    types: [published]

jobs:
  publish-mcp-server:
    name: Publish MCP server to npm
    if: startsWith(github.event.release.tag_name, 'mcp-server@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '^24.11.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify release tag matches the package version
        run: node -e "require('node:assert/strict').equal(process.env.GITHUB_REF_NAME, 'mcp-server@' + require('./package.json').version)"

      - run: npm ci
      - run: npm test

      - name: Check for an existing npm publication
        id: publication
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'

          const [pkg] = JSON.parse(execFileSync('npm', ['pack', '--dry-run', '--json'], { encoding: 'utf8' }))
          const url = `https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${encodeURIComponent(pkg.version)}`
          const response = await fetch(url, { signal: AbortSignal.timeout(30_000) })
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'missing=true\n')
          } else {
            if (!response.ok) throw new Error(`npm registry returned HTTP ${response.status}`)
            const published = await response.json()
            if (!pkg.integrity || published.dist?.integrity !== pkg.integrity) {
              throw new Error(`${pkg.id} already exists on npm with different contents. Choose a new version.`)
            }
            console.log(`${pkg.id} is already published with the same integrity.`)
          }
          NODE

      - name: Publish to npm
        if: steps.publication.outputs.missing == 'true'
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"

  publish-tracker-js:
    name: Publish tracker-js to npm
    if: startsWith(github.event.release.tag_name, 'tracker-js@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: packages/tracker-js

      - name: Build
        run: npm run build
        working-directory: packages/tracker-js

      - name: Run tests
        run: npm test
        working-directory: packages/tracker-js

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/tracker-js

  publish-tracker-node:
    name: Publish tracker-node to npm
    if: startsWith(github.event.release.tag_name, 'tracker-node@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: packages/tracker-node

      - name: Build
        run: npm run build
        working-directory: packages/tracker-node

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/tracker-node

  publish-captcha:
    name: Publish captcha to npm
    if: startsWith(github.event.release.tag_name, 'captcha@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: packages/captcha

      - name: Build
        run: npm run build
        working-directory: packages/captcha

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/captcha

  publish-captcha-validator:
    name: Publish captcha-validator to npm
    if: startsWith(github.event.release.tag_name, 'captcha-validator@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: packages/captcha-validator

      - name: Build
        run: npm run build
        working-directory: packages/captcha-validator

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/captcha-validator
