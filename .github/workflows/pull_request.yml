name: Pull Request Validation Workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, labeled, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  mcp-server-checks:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json
      - run: npm ci
        working-directory: packages/mcp-server
      - run: npm test
        working-directory: packages/mcp-server

  admin-idempotency-checks:
    name: Admin API Idempotency Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: swetrix_idempotency_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=20
      clickhouse:
        image: clickhouse/clickhouse-server:26.8
        env:
          CLICKHOUSE_DB: idempotency_test
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: test
        ports: ['8123:8123']
        options: --health-cmd="clickhouse-client --password test -q 'SELECT 1'" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '^24.12.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --force
      - name: Test retry-safe Admin API creates
        run: npm run test:idempotency -- --runInBand
        env:
          NODE_OPTIONS: --experimental-vm-modules
          SWETRIX_IDEMPOTENCY_TEST_MYSQL_URL: mysql://test:test@127.0.0.1:3306/swetrix_idempotency_test
          SWETRIX_IDEMPOTENCY_TEST_CLICKHOUSE_URL: http://default:test@127.0.0.1:8123

  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
        with:
          persist-credentials: false
      - name: Setup NodeJS ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Backend Dependencies
        run: npm install --force
        working-directory: backend
      - name: Backend Lint Validation
        run: npm run lint
        working-directory: backend
      - name: Backend Code Formatting Validation
        run: npm run format:check
        working-directory: backend
      - name: Backend TypeScript Validation
        run: npm run lint:tsc
        working-directory: backend
      - name: Backend Knip Validation
        run: npm run knip
        working-directory: backend

  web-checks:
    name: Web Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
        with:
          persist-credentials: false
      - name: Setup NodeJS ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Web Dependencies
        run: npm install --force
        working-directory: web
      - name: Web Lint Validation
        run: npm run lint
        working-directory: web
      - name: Web Code Formatting Validation
        run: npm run format:check
        working-directory: web
      - name: Web TypeScript Validation
        run: npm run typecheck
        working-directory: web
      - name: Web Knip Validation
        run: npm run knip
        working-directory: web

  docs-checks:
    name: Documentation Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
        with:
          persist-credentials: false
      - name: Setup NodeJS ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Documentation Dependencies
        run: npm install --force
        working-directory: docs
      - name: Documentation Code Formatting Validation
        run: npm run format:check
        working-directory: docs

  tracker-js-checks:
    name: Tracker JS Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup NodeJS ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: packages/tracker-js/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: packages/tracker-js
      - name: Build
        run: npm run build
        working-directory: packages/tracker-js
      - name: Run tests
        run: npm test
        working-directory: packages/tracker-js

  tracker-node-checks:
    name: Tracker Node Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup NodeJS ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: packages/tracker-node/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: packages/tracker-node
      - name: Build
        run: npm run build
        working-directory: packages/tracker-node

  captcha-checks:
    name: Captcha Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup NodeJS ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: packages/captcha/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: packages/captcha
      - name: Build
        run: npm run build
        working-directory: packages/captcha

  captcha-validator-checks:
    name: Captcha Validator Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x.x]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup NodeJS ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: packages/captcha-validator/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: packages/captcha-validator
      - name: Build
        run: npm run build
        working-directory: packages/captcha-validator
